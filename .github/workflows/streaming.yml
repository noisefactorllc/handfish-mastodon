name: Streaming image

# Builds Mastodon's streaming server from the upstream tag, with upstream's own
# streaming/Dockerfile, on the node base image current at build time, and
# pushes it to the image registry named by the REGISTRY_HOST secret.
#
# Upstream's published mastodon-streaming tags keep the Node release they were
# built with, so a Node security release does not reach them until upstream
# rebuilds. Building here takes it from the node base image instead.

on:
  workflow_dispatch:
    inputs:
      mastodon_version:
        description: 'Upstream Mastodon tag to build from (e.g. v4.7.3)'
        required: true
        type: string
      image_revision:
        description: 'Image revision suffix, bumped when rebuilding the same Mastodon tag (e.g. 1)'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out upstream Mastodon
        env:
          MASTODON_VERSION: ${{ inputs.mastodon_version }}
        run: |
          set -euo pipefail
          [[ "$MASTODON_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::mastodon_version must look like v4.7.3"; exit 1; }
          git clone --quiet --depth 1 --branch "$MASTODON_VERSION" https://github.com/mastodon/mastodon.git upstream
          echo "upstream commit: $(git -C upstream rev-parse HEAD)"

      # An empty host would make docker login fall back to Docker Hub, so a
      # missing REGISTRY_HOST secret stops the job before any credential is sent.
      - name: Log in to the image registry
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
        run: |
          [ -n "$REGISTRY_HOST" ] || { echo "::error::REGISTRY_HOST secret is not set"; exit 1; }
          echo "${{ secrets.REGISTRY_PASS }}" \
            | docker login "$REGISTRY_HOST" \
                -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      - name: Build
        id: build
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          MASTODON_VERSION: ${{ inputs.mastodon_version }}
          IMAGE_REVISION: ${{ inputs.image_revision }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_REVISION" =~ ^[0-9]+$ ]] || { echo "::error::image_revision must be a number"; exit 1; }
          TAG="${REGISTRY_HOST}/mastodon-streaming:${MASTODON_VERSION}-${IMAGE_REVISION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          docker build --pull -f upstream/streaming/Dockerfile -t "$TAG" upstream

      - name: Verify image
        env:
          TAG: ${{ steps.build.outputs.tag }}
          MASTODON_VERSION: ${{ inputs.mastodon_version }}
        run: |
          set -euo pipefail

          arch=$(docker image inspect "$TAG" --format '{{.Os}}/{{.Architecture}}')
          echo "arch: $arch"
          [ "$arch" = "linux/amd64" ] || { echo "::error::expected linux/amd64"; exit 1; }

          node=$(docker run --rm --entrypoint node "$TAG" --version)
          echo "node: $node"

          # The streaming server must load its own entrypoint, not just carry a node binary.
          docker run --rm --entrypoint node "$TAG" -e 'require.resolve("./streaming/index.js")' \
            || { echo "::error::streaming/index.js is not resolvable in the image"; exit 1; }

          {
            echo "### Image \`$TAG\`"
            echo ""
            echo "| check | value |"
            echo "|---|---|"
            echo "| arch | \`$arch\` |"
            echo "| upstream Mastodon | \`$MASTODON_VERSION\` |"
            echo "| node | \`$node\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push
        run: docker push "${{ steps.build.outputs.tag }}"
