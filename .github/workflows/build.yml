name: Build

on:
  push:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/**'
    branches: [main]
  pull_request:
    paths-ignore:
      - '*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/FUNDING.yml'
      - '.github/CODEOWNERS'
      - '.editorconfig'
      - 'docs/**'
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
